<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slipmat Generator — DEV</title>

    <link href="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.2/mapbox-gl-geocoder.css"
    />
    <link rel="stylesheet" href="../blocks/slipmat-generator/src/styles.css" />

    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .dev-header {
        position: fixed;
        top: 6px;
        left: 6px;
        z-index: 9999;
        padding: 3px 8px;
        background: #ffea3b;
        color: #111;
        font:
          11px/1.4 ui-monospace,
          monospace;
        border-radius: 2px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
      }
      /* Fake header/footer heights so --sitwell-header-h / --sitwell-footer-h math works in dev */
      :root {
        --sitwell-header-h: 40px;
        --sitwell-footer-h: 40px;
      }
      .fake-header,
      .fake-footer {
        height: 40px;
        background: #f0f0f0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div class="dev-header">DEV · slipmat-generator</div>

    <div class="fake-header">— Sitwell header placeholder —</div>

    <div class="sm-wrap">
      <div id="sm-map" class="sm-map"></div>

      <div class="sm-side">
        <div class="sm-preview-wrap">
          <img id="sm-preview-img" class="sm-preview-img" alt="" />
          <div class="sm-preview-mask"></div>
          <div class="sm-spindle"></div>
        </div>
        <div id="sm-geocoder" class="sm-geocoder"></div>
        <button id="sm-generate" class="sm-btn" type="button">Згенерувати макет</button>
      </div>
    </div>

    <div class="fake-footer">— Sitwell footer placeholder —</div>

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.js"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.2/mapbox-gl-geocoder.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

    <!-- Local, git-ignored config. Copy from local-config.example.js and put your token here. -->
    <script src="./local-config.js"></script>
    <script src="../blocks/slipmat-generator/src/script.js"></script>
  </body>
</html>
